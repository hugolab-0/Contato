<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./app.js" defer type="module"></script>
    <title>Contatos</title>
</head>

<body class="bg-gray-100 p-10 font-blod">

   
    <h1 class="text-5xl mb-8 font-bold">
        <span class="text-blue-500">Gerenciamento </span>de Contatos
    </h1>


    <div class="bg-white p-6 rounded-lg shadow-xl mb-6">

        <h2 class="text-xl mb-4">
            Adicionar Novo Contato
        </h2>

        <div class="grid grid-cols-2 gap-4">

            <input id="nome" class="border p-2 rounded w-full hover:bg-blue-200 hover:border-blue-600 transition duration-700" placeholder="Nome *">

            <input id="celular" class="border p-2 rounded w-full hover:bg-blue-200 hover:border-blue-600 transition duration-700" placeholder="Celular *">

            <input id="foto" class="border p-2 rounded w-full hover:bg-blue-200 hover:border-blue-600 transition duration-700" placeholder="URL da Foto *">

            <input id="email" class="border p-2 rounded w-full hover:bg-blue-200 hover:border-blue-600 transition duration-700" placeholder="Email *">

            <input id="endereco" class="border p-2 rounded w-full hover:bg-blue-200 hover:border-blue-600 transition duration-700" placeholder="Endereço *">

            <input id="cidade" class="border p-2 rounded w-full hover:bg-blue-200 hover:border-blue-600 transition duration-700" placeholder="Cidade *">

        </div>

        <button id="salvar" class="border mt-4 bg-white text-blue-500 px-5 py-2 w-52 rounded hover:bg-blue-800 hover:text-white transition duration-700">
            SALVAR
        </button>

    </div>

   
    <div id="resposta" class="bg-white p-6 rounded-lg shadow-xl">

    </div>

</body>
</html>
